apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-env-config
  namespace: ragops
data:
  LAKE_DIR: "/data/lake"
  INDEX_DIR: "/data/index"
  RESULTS_DIR: "/results"
  TRACES_DIR: "/traces"
  COLLECTION_NAME: "fast-policies-v1"
  EMBEDDING_VERSION: "lexical-proj-v1"
  CHUNK_SIZE: "320"
  CHUNK_OVERLAP: "80"
  LLM_MODEL: "qwen/qwen3.8-27b"
  VECTOR_STORE_URL: "http://ragops-vector:8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-gate-config
  namespace: ragops
data:
  relevance_threshold: "0.1648"
  max_abstention_drop: "0.0"
  max_false_abstention_rate: "0.25"
  max_recall_at_5_drop: "0.02"
  min_recall_at_5: "0.90"
  min_faithfulness: "0.80"
  min_citation_validity: "0.95"
  max_latency_p95_ms: "7000.0"
  max_determinism_diff: "0.0001"
  max_fallback_count: "0"
