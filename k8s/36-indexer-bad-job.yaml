apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-indexer-bad
  namespace: ragops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: indexer
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/ingest_job.py"]
          envFrom:
            - configMapRef:
                name: ragops-env-config
          env:
            - name: COLLECTION_NAME
              value: "fast-policies-bad"
            - name: EMBEDDING_VERSION
              value: "lexical-proj-v1"
            - name: CHUNK_SIZE
              value: "40"
            - name: CHUNK_OVERLAP
              value: "5"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data-vol
              mountPath: /data
            - name: results-vol
              mountPath: /results
      volumes:
        - name: data-vol
          persistentVolumeClaim:
            claimName: ragops-data-pvc
        - name: results-vol
          persistentVolumeClaim:
            claimName: ragops-results-pvc
